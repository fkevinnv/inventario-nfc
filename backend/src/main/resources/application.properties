# Base de datos H2 guardada en un fichero (la carpeta "datos" se crea sola).
# Así los equipos no se pierden al reiniciar el servidor.
spring.datasource.url=jdbc:h2:file:./datos/inventario
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea y actualiza las tablas a partir de las clases del paquete modelo
spring.jpa.hibernate.ddl-auto=update

# Consola de la base de datos en http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Para que los errores de la API incluyan un mensaje legible
server.error.include-message=always

server.port=8080
